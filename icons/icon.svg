<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Solid Dark Slate Background -->
  <rect width="128" height="128" rx="24" fill="#0b0f19" />
  <rect x="2" y="2" width="124" height="124" rx="22" fill="none" stroke="#1f2937" stroke-width="4" />
  
  <!-- Outer Radio Pulse Wave (Solid Indigo) -->
  <path d="M 28 60 A 40 40 0 0 1 100 60" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />
  
  <!-- Mid Radio Pulse Wave (Solid Blue) -->
  <path d="M 40 70 A 26 26 0 0 1 88 70" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
  
  <!-- Inner Radio Pulse Wave (Solid Emerald) -->
  <path d="M 52 80 A 13 13 0 0 1 76 80" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Radio Mast Tower (Solid Off-White #f3f4f6) -->
  <circle cx="64" cy="84" r="5" fill="#10b981" />
  <path d="M 64 84 L 64 112" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" />
  <path d="M 48 112 L 80 112" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" />
  <path d="M 54 98 L 74 98" stroke="#f3f4f6" stroke-width="4" stroke-linecap="round" />
  <path d="M 52 112 L 64 86 L 76 112" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linejoin="round" />
</svg>
